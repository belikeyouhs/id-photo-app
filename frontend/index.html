<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>证件照生成工具</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <h1>证件照生成工具</h1>
        <p class="subtitle">上传照片，选择尺寸和背景色，一键生成标准证件照</p>
    </header>

    <main class="container">
        <section class="upload-section">
            <div id="dropZone" class="drop-zone">
                <div class="drop-zone__icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                </div>
                <p class="drop-zone__text">拖拽图片到此处，或点击选择文件</p>
                <p class="drop-zone__hint">支持 JPEG / PNG，最大 10MB</p>
                <input type="file" id="fileInput" accept="image/jpeg,image/png" hidden>
            </div>
            <div id="preview" class="preview" hidden>
                <img id="previewImg" alt="预览">
                <button id="removeBtn" class="btn btn--ghost" title="移除图片">&times;</button>
            </div>
            <div id="uploadError" class="error-msg" hidden></div>
        </section>

        <section class="params-section">
            <div class="param-group">
                <label class="param-label">证件照尺寸</label>
                <div id="sizeOptions" class="radio-group">
                    <label class="radio-card">
                        <input type="radio" name="size" value="1inch" checked>
                        <span class="radio-card__body">
                            <span class="radio-card__name">一寸</span>
                            <span class="radio-card__desc">25×35mm</span>
                        </span>
                    </label>
                    <label class="radio-card">
                        <input type="radio" name="size" value="2inch">
                        <span class="radio-card__body">
                            <span class="radio-card__name">二寸</span>
                            <span class="radio-card__desc">35×49mm</span>
                        </span>
                    </label>
                    <label class="radio-card">
                        <input type="radio" name="size" value="small_1inch">
                        <span class="radio-card__body">
                            <span class="radio-card__name">小一寸</span>
                            <span class="radio-card__desc">22×32mm</span>
                        </span>
                    </label>
                    <label class="radio-card">
                        <input type="radio" name="size" value="small_2inch">
                        <span class="radio-card__body">
                            <span class="radio-card__name">小二寸</span>
                            <span class="radio-card__desc">35×45mm</span>
                        </span>
                    </label>
                    <label class="radio-card">
                        <input type="radio" name="size" value="large_1inch">
                        <span class="radio-card__body">
                            <span class="radio-card__name">大一寸</span>
                            <span class="radio-card__desc">33×48mm</span>
                        </span>
                    </label>
                    <label class="radio-card">
                        <input type="radio" name="size" value="large_2inch">
                        <span class="radio-card__body">
                            <span class="radio-card__name">大二寸</span>
                            <span class="radio-card__desc">35×53mm</span>
                        </span>
                    </label>
                    <label class="radio-card">
                        <input type="radio" name="size" value="passport">
                        <span class="radio-card__body">
                            <span class="radio-card__name">护照</span>
                            <span class="radio-card__desc">33×48mm</span>
                        </span>
                    </label>
                    <label class="radio-card">
                        <input type="radio" name="size" value="visa_us">
                        <span class="radio-card__body">
                            <span class="radio-card__name">美国签证</span>
                            <span class="radio-card__desc">51×51mm</span>
                        </span>
                    </label>
                    <label class="radio-card">
                        <input type="radio" name="size" value="visa_japan">
                        <span class="radio-card__body">
                            <span class="radio-card__name">日本签证</span>
                            <span class="radio-card__desc">45×45mm</span>
                        </span>
                    </label>
                    <label class="radio-card">
                        <input type="radio" name="size" value="id_card">
                        <span class="radio-card__body">
                            <span class="radio-card__name">身份证</span>
                            <span class="radio-card__desc">26×32mm</span>
                        </span>
                    </label>
                    <label class="radio-card">
                        <input type="radio" name="size" value="driver_license">
                        <span class="radio-card__body">
                            <span class="radio-card__name">驾驶证</span>
                            <span class="radio-card__desc">22×32mm</span>
                        </span>
                    </label>
                    <label class="radio-card">
                        <input type="radio" name="size" value="custom">
                        <span class="radio-card__body">
                            <span class="radio-card__name">自定义</span>
                            <span class="radio-card__desc">自选尺寸</span>
                        </span>
                    </label>
                </div>
                <div id="customSizeInputs" class="custom-size-inputs" hidden>
                    <div class="custom-size-field">
                        <label for="customWidth">宽度 (mm)</label>
                        <input type="number" id="customWidth" min="10" max="200" step="1" placeholder="10-200">
                    </div>
                    <div class="custom-size-field">
                        <label for="customHeight">高度 (mm)</label>
                        <input type="number" id="customHeight" min="10" max="300" step="1" placeholder="10-300">
                    </div>
                </div>
            </div>

            <div class="param-group">
                <label class="param-label">背景颜色</label>
                <div id="colorOptions" class="color-group">
                    <label class="color-card">
                        <input type="radio" name="bg_color" value="white" checked>
                        <span class="color-card__swatch" style="background:#ffffff; border:1px solid #ddd;"></span>
                        <span class="color-card__name">白色</span>
                    </label>
                    <label class="color-card">
                        <input type="radio" name="bg_color" value="blue">
                        <span class="color-card__swatch" style="background:#438edb;"></span>
                        <span class="color-card__name">蓝色</span>
                    </label>
                    <label class="color-card">
                        <input type="radio" name="bg_color" value="red">
                        <span class="color-card__swatch" style="background:#d03c3c;"></span>
                        <span class="color-card__name">红色</span>
                    </label>
                    <label class="color-card color-card--custom">
                        <input type="radio" name="bg_color" value="custom">
                        <span class="color-card__swatch color-card__swatch--custom">
                            <input type="color" id="customColorPicker" value="#438edb" class="color-picker-input" title="选择自定义颜色">
                        </span>
                        <span class="color-card__name">自定义</span>
                    </label>
                </div>
            </div>

            <button id="generateBtn" class="btn btn--primary" disabled>生成证件照</button>
        </section>

        <section id="resultSection" class="result-section" hidden>
            <h2 class="result-title">生成结果</h2>
            <div class="result-card">
                <div class="result-card__img-wrap">
                    <img id="resultImg" alt="证件照">
                </div>
                <div class="result-card__actions">
                    <a id="downloadBtn" class="btn btn--primary" download>下载证件照</a>
                    <button id="regenerateBtn" class="btn btn--ghost">重新生成</button>
                </div>
            </div>
        </section>

        <div id="loadingOverlay" class="loading-overlay" hidden>
            <div class="spinner"></div>
            <p>正在生成证件照...</p>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
